# Text displayed in the browser tab and at the top of the site.
site_name: flingdia
# Short description used by themes and search engines.
site_description: Spatio-temporal reasoning encodings for flingo / metasp
# Directory containing the Markdown pages. Paths in nav are relative to it.
docs_dir: docs

# Sidebar structure. The text before ":" is the displayed label; the value is
# the corresponding Markdown file inside docs_dir.
nav:
  - Home: index.md
  - Semantics: semantics.md
  - Axioms: axioms.md
  - Relations:
      - line: schemas/rels/line_.md
      - line-point: schemas/rels/line_point.md
      - line-point-point: schemas/rels/line_point_point.md
      - point: schemas/rels/point_.md
      - point-line: schemas/rels/point_line.md
      - point-point: schemas/rels/point_point.md
      - point-rect: schemas/rels/point_rect.md
      - rect: schemas/rels/rect_.md
      - rect-line: schemas/rels/rect_line.md
      - rect-point: schemas/rels/rect_point.md
      - rect-rect (position): schemas/rels/rect_rect_POS.md
      - rect-rect (topology): schemas/rels/rect_rect_TOPO.md
  - Actions:
      - grows: schemas/actions/grows.md
      - move: schemas/actions/move.md

# Files watched in addition to docs_dir. The documentation pages use
# mkdocstrings to extract comments from these ASP encodings, so changing an
# encoding must trigger a rebuild while `mkdocs serve` is running.
watch:
  - semantics.lp
  - axioms.lp
  - schemas

# Visual appearance and navigation behavior, provided by MkDocs Material.
theme:
  # Select the Material for MkDocs theme.
  name: material
  # Optional Material features:
  features:
    # Allow section index pages to act as navigation entries.
    - navigation.indexes
    # Update the URL as the reader moves between page sections.
    - navigation.tracking
    # Initially expand all sections in the navigation sidebar.
    - navigation.expand
    # Keep the table of contents focused on the current section.
    - toc.follow
    # Add a copy button to code blocks.
    - content.code.copy
  # Follow the operating-system color preference and provide a manual toggle.
  palette:
    # Light color scheme.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark color scheme.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Markdown features enabled for ordinary pages and documentation extracted
# from comments by mkdocstrings/clindocs.
markdown_extensions:
  # Support blocks such as !!! note and !!! warning.
  - admonition
  # Allow attributes such as {.class} and {#id} on Markdown elements.
  - attr_list
  # Parse Markdown nested inside HTML blocks marked with markdown="1".
  - md_in_html
  # Support footnote references and definitions.
  - footnotes
  # Make admonitions collapsible with ??? and ???+ syntax.
  - pymdownx.details
  # Improve fenced code blocks and define Mermaid as a custom fence.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Render emoji and Material icon shortcodes as SVG.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Apply syntax highlighting to fenced code blocks.
  - pymdownx.highlight:
      use_pygments: true
      # Add a language-specific CSS class, for example language-clingo.
      pygments_lang_class: true
  # Generate a table of contents from headings.
  - toc:
      # Add clickable paragraph symbols next to headings.
      permalink: true

# Additional stylesheets copied from docs_dir and loaded after the theme CSS.
extra_css:
  - assets/nav.css

# Add predicate headings generated by clindocs to the page table of contents.
extra_javascript:
  - assets/encoding-toc.js

# MkDocs plugins run while the site is built.
plugins:
  # Build the site's client-side search index.
  - search
  # Resolve cross-references produced by documentation tools.
  - autorefs
  # Turn ::: directives in Markdown pages into extracted API/encoding docs.
  - mkdocstrings:
      handlers:
        # clindocs supplies this handler for comments and source in ASP files.
        asp: {}
