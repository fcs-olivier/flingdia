site_name: flingdia
site_description: Spatio-temporal reasoning encodings for flingo / metasp
docs_dir: docs

nav:
  - Home: index.md
  - Semantics: semantics.md
  - Axioms: axioms.md
  - Schemas:
      - Geometric sorts: schemas/geo_sorts.md
      - Actions:
          - grows.lp: schemas/actions/grows.md
          - move.lp: schemas/actions/move.md
      - Derived terms (multiple objects):
          - derived_multi_objs_dist.lp: schemas/derived_terms_multi_objs/derived_multi_objs_dist.md
          - derived_multi_objs_dist_in_far.lp: schemas/derived_terms_multi_objs/derived_multi_objs_dist_in_far.md
          - derived_multi_objs_dist_with_formula.lp: schemas/derived_terms_multi_objs/derived_multi_objs_dist_with_formula.md
      - Relations:
          - line_.lp: schemas/rels/line_.md
          - point_.lp: schemas/rels/point_.md
          - point_point.lp: schemas/rels/point_point.md
          - point_rect.lp: schemas/rels/point_rect.md
          - rect_.lp: schemas/rels/rect_.md
          - rect_line.lp: schemas/rels/rect_line.md
          - rect_point.lp: schemas/rels/rect_point.md
          - rect_rect_POS.lp: schemas/rels/rect_rect_POS.md
          - rect_rect_TOPO.lp: schemas/rels/rect_rect_TOPO.md

# The encodings live outside docs_dir, so mkdocs serve has to watch them explicitly.
watch:
  - semantics.lp
  - axioms.lp
  - schemas

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.tracking
    - navigation.expand
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
  - toc:
      permalink: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        asp: {}
